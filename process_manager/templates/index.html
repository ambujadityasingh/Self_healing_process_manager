<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Self-Healing Process Manager</title><style>
body{font:15px system-ui;margin:2rem auto;max-width:1100px;padding:0 1rem;background:#f5f7fa;color:#182230}h1{margin-bottom:.2rem}.muted{color:#617083}.card{background:white;padding:1rem 1.2rem;border-radius:12px;margin:1rem 0;box-shadow:0 2px 10px #142a4011}table{width:100%;border-collapse:collapse}td,th{text-align:left;padding:.55rem;border-bottom:1px solid #e6ebf1}.pill{border-radius:20px;background:#e7f4ed;padding:.2rem .6rem}.crit{background:#ffe5e3}canvas{width:100%;height:210px}.banner{padding:.8rem 1rem;background:#e9f2ff;border-radius:8px;margin-top:1rem}.small{font-size:13px}
</style></head><body><h1>Self-Healing Process Manager</h1><div class="muted">CPU recovery uses sustained load, desktop activity, and foreground status; an action is escalated only if CPU does not recover.</div><div id="activity" class="banner">Checking desktop activity…</div><section class="card"><h2>Monitored processes</h2><table><thead><tr><th>PID</th><th>Name</th><th>CPU</th><th>Memory</th><th>State</th><th>User activity</th></tr></thead><tbody id="processes"></tbody></table></section><section class="card"><h2>Recent CPU samples</h2><canvas id="chart" width="1000" height="210"></canvas></section><section class="card"><h2>Incidents and recovery outcomes</h2><div id="history" class="small"></div></section><script>
async function update(){let d=await (await fetch('/api/state')).json();let a=d.activity;document.querySelector('#activity').textContent=a&&a.supported?`Desktop idle ${Math.floor(a.idle_seconds)}s · foreground PID ${a.foreground_pid??'unknown'} · source: ${a.source}`:`Desktop activity unavailable (${a?.source||'unknown'}). Automatic termination is disabled until user inactivity and foreground status can be verified.`;document.querySelector('#processes').innerHTML=d.processes.map(x=>`<tr><td>${x.pid}</td><td>${x.name}</td><td>${x.cpu_percent.toFixed(1)}%</td><td>${x.memory_mb.toFixed(1)} MB</td><td><span class="pill ${x.status==='running'?'':'crit'}">${x.status}</span></td><td>${x.foreground===true?'foreground':x.foreground===false?`background · idle ${x.user_idle_seconds?.toFixed(0)??'?'}s`:'unknown'}</td></tr>`).join('');let c=document.querySelector('#chart'),g=c.getContext('2d'),s=d.samples.slice().reverse();g.clearRect(0,0,c.width,c.height);g.strokeStyle='#dbe3eb';for(let y=0;y<=100;y+=25){let yy=c.height-y/100*c.height;g.beginPath();g.moveTo(40,yy);g.lineTo(c.width,yy);g.stroke();g.fillStyle='#617083';g.fillText(y+'%',2,yy+4)}g.strokeStyle='#1683d8';g.lineWidth=2;g.beginPath();s.forEach((x,i)=>{let xx=40+i*(c.width-50)/Math.max(1,s.length-1),yy=c.height-Math.min(x.cpu,100)/100*c.height;if(i)g.lineTo(xx,yy);else g.moveTo(xx,yy)});g.stroke();let incidents=d.incidents.map(x=>`${new Date(x.ts*1000).toLocaleTimeString()} · PID ${x.pid} · detected ${x.anomaly} (${x.severity}): ${x.detail}`).join('<br>')||'<span class="muted">No problems detected.</span>';let actions=d.actions.map(x=>`${new Date(x.ts*1000).toLocaleTimeString()} · PID ${x.pid} · ${x.action}: ${x.result} · outcome: ${x.outcome||'pending'}${x.outcome_detail?' · '+x.outcome_detail:''}`).join('<br>')||'<span class="muted">No recovery actions taken.</span>';document.querySelector('#history').innerHTML=`<strong>Detected problems</strong><br>${incidents}<br><br><strong>Actions and results</strong><br>${actions}`}update();setInterval(update,2000);
</script></body></html>
